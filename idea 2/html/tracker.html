<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f0f8ff;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #0077cc;
    }

    canvas {
      margin-top: 30px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .back-link {
      margin-top: 20px;
    }

    .back-link a {
      color: #0077cc;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Mood Tracker</h1>
    <p>Here's how your mood has changed over the past week:</p>
    <canvas id="moodChart" width="600" height="300"></canvas>

    <div class="back-link">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('moodChart').getContext('2d');
    const moodChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'Mood Level (1–10)',
          data: [5, 6, 4, 7, 8, 6, 9],
          backgroundColor: 'rgba(0, 119, 204, 0.2)',
          borderColor: '#0077cc',
          borderWidth: 2,
          fill: true,
          tension: 0.3,
          pointRadius: 5,
          pointBackgroundColor: '#0077cc'
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            max: 10
          }
        }
      }
    });
  </script>
</body>
</html>
